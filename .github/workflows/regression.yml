name: Cardbound Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run browser regression suite 50x
        run: npm run test:e2e
      - name: Summarize regression results
        if: always()
        run: node scripts/summarize-tests.js
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardbound-regression-results
          path: test-results/
          if-no-files-found: warn
