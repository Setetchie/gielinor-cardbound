name: Cardbound Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-regression:
    name: Regression ${{ matrix.name }} (${{ matrix.executions }} executions)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: prototype
            spec: tests/smoke.spec.js
            executions: 550
          - name: greenwake-original-ip
            spec: tests/original.spec.js
            executions: 400
          - name: ip-inventory
            spec: tests/inventory.spec.js
            executions: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.name }} regression 50x
        run: npm run test:e2e -- ${{ matrix.spec }}
      - name: Summarize ${{ matrix.name }} results
        if: always()
        run: node scripts/summarize-tests.js
      - name: Upload ${{ matrix.name }} regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardbound-regression-${{ matrix.name }}
          path: test-results/
          if-no-files-found: warn

  acceptance-gate:
    name: 1,000-execution acceptance gate
    runs-on: ubuntu-latest
    if: always()
    needs: browser-regression
    steps:
      - name: Require every regression shard to pass
        run: |
          echo "browser-regression result: ${{ needs.browser-regression.result }}"
          test "${{ needs.browser-regression.result }}" = "success"
