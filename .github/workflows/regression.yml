name: Cardbound Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-regression:
    name: Regression ${{ matrix.name }} (${{ matrix.executions }} executions)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        include:
          - name: prototype-core
            spec: tests/smoke.spec.js
            grep: 'app boots|home shows|Activity > Skilling'
            executions: 150
          - name: prototype-progression
            spec: tests/smoke.spec.js
            grep: 'Sailing has actions|idle settlement|next unlock helper'
            executions: 150
          - name: prototype-ui
            spec: tests/smoke.spec.js
            grep: 'bank renders|collection supports|pack definitions'
            executions: 150
          - name: prototype-integrity
            spec: tests/smoke.spec.js
            grep: 'raid and challenge|save survives'
            executions: 100
          - name: greenwake-ip
            spec: tests/original.spec.js
            grep: 'original mode swaps|original mode renders'
            executions: 100
          - name: greenwake-terminology
            spec: tests/original.spec.js
            grep: 'original terminology|Huntsmanship starts'
            executions: 100
          - name: greenwake-progression
            spec: tests/original.spec.js
            grep: 'Greenwake Sailing|Greenwake idle'
            executions: 100
          - name: greenwake-content
            spec: tests/original.spec.js
            grep: 'Greenwake packs|Greenwake next Woodcraft'
            executions: 100
          - name: ip-inventory
            spec: tests/inventory.spec.js
            grep: '.*'
            executions: 50
          - name: v43-structure
            spec: tests/v43-structure.spec.js
            grep: '.*'
            executions: 400
          - name: v44-ux
            spec: tests/v44-ux.spec.js
            grep: '.*'
            executions: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.name }} regression 50x
        run: npm run test:e2e -- ${{ matrix.spec }} --grep "${{ matrix.grep }}"
      - name: Summarize ${{ matrix.name }} results
        if: always()
        run: node scripts/summarize-tests.js
      - name: Upload ${{ matrix.name }} regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardbound-regression-${{ matrix.name }}
          path: test-results/
          if-no-files-found: warn

  acceptance-gate:
    name: 1,500-execution acceptance gate
    runs-on: ubuntu-latest
    if: always()
    needs: browser-regression
    steps:
      - name: Require every regression shard to pass
        run: |
          echo "browser-regression result: ${{ needs.browser-regression.result }}"
          test "${{ needs.browser-regression.result }}" = "success"
